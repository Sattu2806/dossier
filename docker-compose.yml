# Local production-shaped stack: the API on Postgres instead of SQLite.
#   docker compose up --build
#   docker compose exec api dossier user you@example.com   # prints an API key
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dossier}
      POSTGRES_DB: dossier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API's first query would otherwise race Postgres' startup.
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8500:8500"
    environment:
      # Only the database URL changes between SQLite and Postgres — the point
      # of using SQLAlchemy Core behind one module.
      DOSSIER_DATABASE_URL: postgresql+psycopg://dossier:${POSTGRES_PASSWORD:-dossier}@db:5432/dossier
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?set TAVILY_API_KEY in your .env}
      DOSSIER_MODEL: ${DOSSIER_MODEL:-gemini-3.5-flash-lite}
      DOSSIER_DAILY_TOKEN_LIMIT: ${DOSSIER_DAILY_TOKEN_LIMIT:-500000}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-dossier}
    volumes:
      # The vector index lives outside the container so a rebuild doesn't
      # discard everything the user ingested.
      - dossier-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  dossier-data:
