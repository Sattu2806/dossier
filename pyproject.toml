[project]
name = "dossier"
version = "0.1.0"
description = "Multi-agent research assistant: plan, research, write, self-critique (LangGraph)"
readme = "README.md"
authors = [
    { name = "Satender", email = "webdevsattu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=2.2.0",
    "pyjwt[crypto]>=2.14.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "tavily-python>=0.8.3",
]

[project.scripts]
dossier = "dossier.cli:main"
dossier-mcp = "dossier.mcp_server:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["playground"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is "call this in the default argument".
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.File", "fastapi.Form"]
